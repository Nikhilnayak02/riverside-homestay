name: Mirror gh-pages to site-deploy

on:
  push:
    branches: [ gh-pages ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    name: Mirror gh-pages to site-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add site-deploy remote
        run: |
          git remote add site-deploy https://x-access-token:${{ secrets.DEPLOY_PAT }}@github.com/${{ github.repository_owner }}/site-deploy.git
          git fetch site-deploy || true

      - name: Push to site-deploy
        run: |
          git push site-deploy gh-pages:gh-pages --force
